<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMETEO</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap');

        body {
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Chakra Petch', sans-serif;
            color: #fff;
        }

        /* BOX PRINCIPALE – IDENTICO ALLA VERSIONE CHE TI PIACE */
        .container {
            background: rgb(20, 20, 20);
            padding: 55px;
            border-radius: 12px;
            border: 4px solid #b00000;
            box-shadow: 0 0 25px #ff0000aa, 0 0 10px #660000;
            max-width: 420px;
            width: 90%;
            margin: 0 auto;
            margin-top: 100px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 160px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0px 0px 6px #ff0000);
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
            width: 70%;
        }

        input {
            padding: 14px;
            width: 100%;
            box-sizing: border-box;
            border: 3px solid #ff0000;
            border-radius: 6px;
            font-size: 18px;
            outline: none;
            background: #111;
            color: #fff;
        }

        input:focus {
            border-color: #ff4444;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border: 3px solid #ff0000;
            border-radius: 6px;
            box-shadow: 0 0 10px #ff0000aa;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 5px;
            padding: 0;
            list-style: none;
            display: none;
        }

        .suggestions-list li {
            padding: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
        }

        .suggestions-list li:hover {
            background: #330000;
        }

        button {
            padding: 14px 22px;
            background: #b00000;
            border: 3px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px #ff0000aa;
        }

        button:hover {
            background: #ff0000;
        }

        .result {
            margin-top: 30px;
            display: none;
            background: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            border: 3px solid #ff0000;
            box-shadow: 0 0 10px #ff0000aa;
            text-align: center;
        }

        #cityName {
            font-size: 26px;
            color: #ff4444;
        }

        .temp {
            font-size: 48px;
            color: #ff0000;
            text-shadow: 2px 2px #660000;
        }

        .desc {
            font-size: 18px;
            color: #cccccc;
        }

        .weather-icon {
            width: 42px;
            height: 42px;
            image-rendering: pixelated;
            margin: 10px auto;
            display: block;
        }

        .error {
            color: #ff4444;
            margin-top: 15px;
            display: none;
            font-size: 16px;
        }

        /* PREVISIONI – PC: ORIZZONTALI */
        .forecast-container {
            margin-top: 30px;
            display: flex;
            flex-direction: row;
            gap: 20px;
            overflow-x: auto;
            padding: 10px;
            justify-content: flex-start;
        }

        .forecast-day {
            min-width: 200px;
            background: #111;
            border: 3px solid #ff0000;
            border-radius: 12px;
            text-align: center;
            padding: 18px;
            box-shadow: 0 0 12px #ff0000aa;
            flex-shrink: 0;
        }

        .forecast-day h4 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .forecast-day p {
            font-size: 15px;
            margin: 4px 0;
        }

        #backBtn {
            display: none;
            margin-top: 25px;
            padding: 14px 22px;
            background: #660000;
            border: 3px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0000aa;
            align-self: flex-end;
        }

        ::-webkit-scrollbar {
          width: 10px;
        }

        ::-webkit-scrollbar-track {
          background: #0a0a0a;
          border-left: 2px solid #300;
        }

        ::-webkit-scrollbar-thumb {
          background: #700;
          border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
          background: #a00;
        }

        /* 📱 SOLO MOBILE: SISTEMO LE CASELLE, NON TOCCO IL BOX */
        @media (max-width: 480px) {

            .forecast-container {
                flex-direction: column;      /* verticale */
                overflow-x: hidden;
                overflow-y: auto;
                gap: 10px;
                padding: 0;
                width: 100%;
            }

            .forecast-day {
                width: 100%;
                min-width: 100%;
                box-sizing: border-box;      /* include bordo e padding */
                padding: 12px;
                border-radius: 10px;
            }

            .forecast-day h4 {
                font-size: 14px;
                margin-bottom: 4px;
            }

            .forecast-day p {
                font-size: 12px;
                margin: 2px 0;
            }

            .weather-icon {
                width: 28px;
                height: 28px;
                margin: 4px auto;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">

    <div class="search-box">
        <div class="search-container">
            <input type="text" id="cityInput" placeholder="Inserisci una città..." autocomplete="off">
            <ul id="suggestions" class="suggestions-list"></ul>
        </div>
        <button onclick="getWeather()">Cerca</button>
    </div>

    <div id="errorBox" class="error">Città non trovata...</div>

    <div id="resultBox" class="result">
        <h3 id="cityName"></h3>
        <div class="temp" id="cityTemp"></div>
        <div class="desc" id="cityDesc"></div>
    </div>

    <div id="forecastBox" class="forecast-container"></div>

    <button id="backBtn" onclick="goBack()">Torna alla ricerca</button>

</div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMETEO</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap');

        body {
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Chakra Petch', sans-serif;
            color: #fff;
        }

        /* ⭐ BOX PRINCIPALE — VERSIONE ORIGINALE */
        .container {
            background: rgb(20, 20, 20);
            padding: 55px;
            border-radius: 12px;
            border: 4px solid #b00000;
            box-shadow: 0 0 25px #ff0000aa, 0 0 10px #660000;
            max-width: 420px;
            width: 90%;
            margin: 0 auto;
            margin-top: 100px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 160px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0px 0px 6px #ff0000);
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
            width: 70%;
        }

        input {
            padding: 14px;
            width: 100%;
            box-sizing: border-box;
            border: 3px solid #ff0000;
            border-radius: 6px;
            font-size: 18px;
            outline: none;
            background: #111;
            color: #fff;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border: 3px solid #ff0000;
            border-radius: 6px;
            box-shadow: 0 0 10px #ff0000aa;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 5px;
            padding: 0;
            list-style: none;
            display: none;
        }

        .suggestions-list li {
            padding: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
        }

        button {
            padding: 14px 22px;
            background: #b00000;
            border: 3px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0000aa;
        }

        /* ⭐ PREVISIONI — PC */
        .forecast-container {
            margin-top: 30px;
            display: flex;
            flex-direction: row;
            gap: 20px;
            overflow-x: auto;
            padding: 10px;
            justify-content: flex-start;
        }

        .forecast-day {
            min-width: 200px;
            background: #111;
            border: 3px solid #ff0000;
            border-radius: 12px;
            text-align: center;
            padding: 18px;
            box-shadow: 0 0 12px #ff0000aa;
            flex-shrink: 0;
        }

        .weather-icon {
            width: 42px;
            height: 42px;
            margin: 10px auto;
        }

        /* 📱 MOBILE — SOLO CASELLE */
        @media (max-width: 480px) {

            .forecast-container {
                flex-direction: column;
                overflow-x: hidden;
                overflow-y: auto;
                gap: 10px;
                padding: 0;
                width: 100%;
            }

            .forecast-day {
                width: 100%;
                min-width: 100%;
                padding: 12px;
                border-radius: 10px;
                box-sizing: border-box;
            }

            .forecast-day h4 {
                font-size: 15px;
                margin-bottom: 6px;
            }

            .forecast-day p {
                font-size: 13px;
                margin: 2px 0;
            }

            .weather-icon {
                width: 30px;
                height: 30px;
                margin: 6px auto;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Logo" class="logo">

    <div class="search-box">
        <div class="search-container">
            <input type="text" id="cityInput" placeholder="Inserisci una città..." autocomplete="off">
            <ul id="suggestions" class="suggestions-list"></ul>
        </div>
        <button onclick="getWeather()">Cerca</button>
    </div>

    <div id="resultBox" class="result">
        <h3 id="cityName"></h3>
        <div class="temp" id="cityTemp"></div>
        <div class="desc" id="cityDesc"></div>
    </div>

    <div id="forecastBox" class="forecast-container"></div>

</div>

<script src="app.js"></script>
</body>
</html>

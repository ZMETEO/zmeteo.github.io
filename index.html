<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMETEO</title>
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&display=swap');

        body {
            background-image: url('sfondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Chakra Petch', sans-serif;
            color: #fff;
        }

        .container {
            background: rgb(20, 20, 20);
            padding: 55px;
            border-radius: 12px;
            border: 4px solid #b00000;
            box-shadow: 0 0 25px #ff0000aa, 0 0 10px #660000;
            max-width: 420px;
            width: 90%;
            margin: 0 auto;
            margin-top: 150px;
            position: relative;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 160px;
            height: auto;
            margin-bottom: 25px;
            filter: drop-shadow(0px 0px 6px #ff0000);
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
            width: 70%;
        }

        input {
            padding: 14px;
            width: 100%;
            box-sizing: border-box;
            border: 3px solid #ff0000;
            border-radius: 6px;
            font-size: 18px;
            outline: none;
            background: #111;
            color: #fff;
        }

        input:focus {
            border-color: #ff4444;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #1a1a1a;
            border: 3px solid #ff0000;
            border-radius: 6px;
            box-shadow: 0 0 10px #ff0000aa;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            margin-top: 5px;
            padding: 0;
            list-style: none;
            display: none;
        }

        .suggestions-list li {
            padding: 12px;
            cursor: pointer;
            font-size: 14px;
            color: #fff;
        }

        .suggestions-list li:hover {
            background: #330000;
        }

        button {
            padding: 14px 22px;
            background: #b00000;
            border: 3px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 10px #ff0000aa;
        }

        button:hover {
            background: #ff0000;
        }

        .result {
            margin-top: 30px;
            display: none;
            background: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            border: 3px solid #ff0000;
            box-shadow: 0 0 10px #ff0000aa;
            text-align: center;
        }

        #cityName {
            font-size: 26px;
            color: #ff4444;
        }

        .temp {
            font-size: 48px;
            color: #ff0000;
            text-shadow: 2px 2px #660000;
        }

        .desc {
            font-size: 18px;
            color: #cccccc;
        }

        .weather-icon {
            width: 48px;
            height: 48px;
            image-rendering: pixelated;
            margin: 10px auto;
            display: block;
        }

        .error {
            color: #ff4444;
            margin-top: 15px;
            display: none;
            font-size: 16px;
        }

        .forecast-container {
            margin-top: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }

        .forecast-day {
            background: #111;
            border: 3px solid #ff0000;
            border-radius: 10px;
            width: 130px;
            text-align: center;
            padding: 14px;
            box-shadow: 0 0 10px #ff0000aa;
        }

        .forecast-day h4 {
            font-size: 16px;
            color: #ff4444;
        }

        .forecast-day p {
            font-size: 14px;
            color: #cccccc;
        }

        #backBtn {
            display: none;
            margin-top: 25px;
            padding: 14px 22px;
            background: #660000;
            border: 3px solid #ff0000;
            color: #fff;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 0 10px #ff0000aa;
            align-self: flex-end;
        }

        /* Scrollbar SMP Minimal Hardcore */
        ::-webkit-scrollbar {
          width: 10px;
        }

        ::-webkit-scrollbar-track {
          background: #0a0a0a;
          border-left: 2px solid #300;
        }

        ::-webkit-scrollbar-thumb {
          background: #700;
          border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
          background: #a00;
        }

        /* ⭐ BLOCCO MOBILE AGGIUNTO */
@media (max-width: 480px) {
    .container {
        margin-top: 90px !important;     /* più alto → non copre la scritta */
        padding: 35px !important;        /* più piccolo → non gigante */
        max-width: 340px !important;     /* proporzionato per telefono */
        border-width: 3px !important;    /* bordo leggermente più fine */
        box-shadow: 0 0 18px #ff0000aa;  /* glow più contenuto */
    }

    .logo {
        width: 130px !important;         /* logo più piccolo */
        margin-bottom: 18px !important;
    }

    .search-container {
        width: 100% !important;
    }

    input {
        padding: 12px !important;
        font-size: 16px !important;
    }

    button {
        padding: 12px 18px !important;
        font-size: 16px !important;
    }
}
.social-bar {
    width: 100%;
    margin-top: 250px;          /* 🔥 spinge la barra verso il basso */
    margin-bottom: 40px;       /* 🔥 crea spazio dal fondo */
    display: flex;
    justify-content: center;   /* 🔥 centrate orizzontalmente */
    gap: 20px;
}

.social-bar img {
    width: 32px;
    height: 32px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 6px #ff0000aa);
    transition: transform 0.2s, filter 0.2s;
    cursor: pointer;
}

.social-bar img:hover {
    transform: scale(1.15);
    filter: drop-shadow(0 0 10px #ff0000);
}
    </style>
    
</head>

<body>

<div class="container">

    <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">

    <div class="search-box">
        <div class="search-container">
            <input type="text" id="cityInput" placeholder="Inserisci una città..." autocomplete="off">
            <ul id="suggestions" class="suggestions-list"></ul>
        </div>
        <button onclick="getWeather()">Cerca</button>
    </div>

    <div id="errorBox" class="error">Città non trovata...</div>

    <div id="resultBox" class="result">
        <h3 id="cityName"></h3>
        <div class="temp" id="cityTemp"></div>
        <div class="desc" id="cityDesc"></div>
    </div>

    <div id="forecastBox" class="forecast-container"></div>

    <button id="backBtn" onclick="goBack()">Torna alla ricerca</button>

</div>
<div class="social-bar">
    <a href="https://www.instagram.com/zkraftmc" target="_blank">
        <img src="icons/instagram.png" alt="Instagram">
    </a>

    <a href="https://www.tiktok.com/@zkraftmc" target="_blank">
        <img src="icons/tiktok.png" alt="TikTok">
    </a>

    <a href="https://www.youtube.com/@zkraftmc" target="_blank">
        <img src="icons/youtube.png" alt="YouTube">
    </a>

    <a href="https://discord.gg/TYaZ3eM5Q" target="_blank">
        <img src="icons/discord.png" alt="Discord">
    </a>
</div>

<script src="app.js"></script>
</body>
</html>
